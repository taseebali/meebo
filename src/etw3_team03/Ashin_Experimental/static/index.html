<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo Teleop HUD | Team 03</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Header HUD Bar -->
        <header class="hud-header">
            <div class="brand">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">MEEBO <span class="sub-logo">TELEOP HUD</span></span>
            </div>
            <div class="status-bar">
                <div class="status-badge" id="net-status">
                    <span class="dot green"></span> ONLINE
                </div>
                <div class="status-badge" id="gamepad-status">
                    <span class="dot gray"></span> GAMEPAD: NONE
                </div>
                <div class="status-badge" id="fps-counter">
                    FPS: <span id="fps-val">30</span>
                </div>
            </div>
        </header>

        <!-- Main Video & Telemetry Display -->
        <main class="viewport-section">
            <div class="video-card">
                <div class="hud-overlay-top">
                    <span class="cam-label">FRONT CAM 01 // LIVE</span>
                    <span class="rec-dot">● REC</span>
                </div>
                <img src="/video_feed" id="camera-stream" alt="Live Camera Stream" onerror="this.src=''; this.alt='Stream Connection Offline';">
                
                <div class="hud-overlay-bottom">
                    <div class="telemetry-item">
                        <span class="t-label">SPEED</span>
                        <span class="t-val" id="disp-speed">0.00</span>
                    </div>
                    <div class="telemetry-item">
                        <span class="t-label">STEER</span>
                        <span class="t-val" id="disp-steer">0.00</span>
                    </div>
                    <div class="telemetry-item">
                        <span class="t-label">CONTROL MODE</span>
                        <span class="t-val highlight" id="disp-mode">KEYBOARD (WASD)</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Controls HUD Panel -->
        <footer class="controls-panel">
            <div class="keyboard-guide">
                <h3>KEYBOARD COMMANDS</h3>
                <div class="wasd-grid">
                    <div></div>
                    <div class="key-cap" id="key-w">W</div>
                    <div></div>
                    <div class="key-cap" id="key-a">A</div>
                    <div class="key-cap" id="key-s">S</div>
                    <div class="key-cap" id="key-d">D</div>
                </div>
                <div class="key-space" id="key-space">SPACEBAR - EMERGENCY STOP</div>
            </div>

            <div class="gamepad-visualizer">
                <h3>XINPUT / GAMEPAD TELEMETRY</h3>
                <div class="stick-outer">
                    <div class="stick-inner" id="stick-dot"></div>
                </div>
                <p class="gp-sub" id="gp-name">Plug in any Xbox / USB Controller</p>
            </div>

            <div class="action-panel">
                <button class="btn-estop" id="btn-estop">E-STOP ROBOT</button>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
